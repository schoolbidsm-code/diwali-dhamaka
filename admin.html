async function unlock(){
  const pw = document.getElementById('pw').value;
  const msg = document.getElementById('pwmsg');
  if (!pw){ msg.textContent = 'Password daalein.'; return; }
  msg.textContent = 'खुल रहा है...';
  try {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const aes = await crypto.subtle.deriveKey({name:'PBKDF2', salt: b64d(ENCKEY.s), iterations: 200000, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv: b64d(ENCKEY.i)}, aes, b64d(ENCKEY.c));
    localStorage.setItem('dl_admin_key', new TextDecoder().decode(pt));
    document.getElementById('pwGate').style.display = 'none';
    document.getElementById('panel').style.display = 'block';
    msg.textContent = '';
    load();
  } catch(e){ msg.textContent = 'Password गलत है, दोबारा try करें।'; }
}
if (localStorage.getItem('dl_admin_key')){ document.getElementById('pwGate').style.display = 'none'; document.getElementById('panel').style.display = 'block'; }
async function privKey(){
  const v = localStorage.getItem('dl_admin_key');
  if (!v){ document.getElementById('msg').textContent = 'पहले key paste करके सेव करें।'; return null; }
  return crypto.subtle.importKey('jwk', JSON.parse(v), {name:'RSA-OAEP', hash:'SHA-256'}, false, ['decrypt']);
}
async function dec(blob, pk){
  const [ivb, ctb] = blob.v.split('.');
  const rawKey = await crypto.subtle.decrypt({name:'RSA-OAEP', hash:'SHA-256'}, pk, b64d(blob.k));
  const aes = await crypto.subtle.importKey('raw', rawKey, 'AES-GCM', false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv: b64d(ivb)}, aes, b64d(ctb));
  return new TextDecoder().decode(pt);
}
async function allRecords(){
  const seen = {}; const out = [];
  const r = await fetch(TOPIC_URL + '/json?poll=1&since=all');
  const lines = (await r.text()).trim().split('\n').filter(Boolean);
  for (const l of lines){
    try { const m = JSON.parse(l); if (m.event === 'message' && m.message){ const o = JSON.parse(m.message); if (!seen[o.dg + '|' + o.c]){ seen[o.dg + '|' + o.c] = 1; out.push(o); } } } catch(e){}
  }
  try {
    const b = await fetch('entries.json');
    if (b.ok){
      const arr = await b.json();
      for (const o of arr){ if (!seen[o.dg + '|' + o.c]){ seen[o.dg + '|' + o.c] = 1; out.push(o); } }
    }
  } catch(e){}
  return out;
}
async function load(){
  const msg = document.getElementById('msg');
  msg.textContent = 'लोड हो रहा है...';
  const pk = await privKey(); if (!pk) return;
  let records;
  try { records = await allRecords(); } catch(e){ msg.textContent = 'नेटवर्क में दिक्कत: ' + e; return; }
  const regs = records.filter(o => o.t === 'reg');
  const games = {};
  for (const o of records) if (o.t === 'game') games[o.c] = true;
  let h = '<table><tr><th>#</th><th>नाम</th><th>फोन</th><th>कोड</th><th>गेम</th><th>रेफ़</th><th>समय</th><th>विजेता?</th></tr>';
  const rows = [];
  const seenPhone = {};
  for (let i = 0; i < regs.length; i++){
    const o = regs[i];
    let name = '?', phone = '?';
    try { name = await dec(o.n, pk); phone = await dec(o.p, pk); } catch(e){ name = '(decrypt fail)'; }
    if (phone !== '?' && seenPhone[phone]) continue;
    seenPhone[phone] = 1;
    const t = new Date(o.d).toLocaleString('hi-IN', {timeZone:'Asia/Kolkata', day:'numeric', month:'short', hour:'numeric', minute:'2-digit', hour12:true});
    rows.push({i:i+1, name, phone, code:o.c, game: games[o.c] ? 'हाँ' : 'नहीं', ref: o.r || '-', t});
    h += '<tr><td>' + (i+1) + '</td><td>' + name.replace(/</g,'&lt;') + '</td><td>' + phone + '</td><td>' + o.c + '</td><td>' + (games[o.c] ? 'हाँ' : 'नहीं') + '</td><td>' + (o.r || '-') + '</td><td>' + t + '</td><td><input type="checkbox" class="pick" data-code="' + o.c + '"></td></tr>';
  }
  h += '</table>';
  document.getElementById('out').innerHTML = h;
  const g = regs.filter(o => games[o.c]).length;
  document.getElementById('sum').style.display = 'block';
  document.getElementById('sum').textContent = 'कुल ' + rows.length + ' एंट्री · ' + g + ' ने गेम पूरा किया';
  window._rows = rows;
  msg.textContent = 'तैयार।';
}
function dlCSV(){
  if (!window._rows){ alert('पहले एंट्री लोड करें'); return; }
  let csv = 'sr,name,phone,code,game_done,ref,time\n';
  for (const r of window._rows) csv += [r.i, '"' + r.name + '"', r.phone, r.code, r.game, r.ref, '"' + r.t + '"'].join(',') + '\n';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
  a.download = 'diwali-entries.csv'; a.click();
}
function pickWinners(){
  const picked = [...document.querySelectorAll('.pick:checked')].map(e => e.dataset.code);
  if (picked.length !== 3){ alert('ठीक 3 विजेता चुनें (अभी ' + picked.length + ')'); return; }
  const names = picked.map(c => { const r = window._rows.find(x => x.code === c); return r ? (r.name + ' (' + r.phone + ')') : c; });
  document.getElementById('sum').innerHTML = 'विजेता: ' + names.map(n => n.replace(/</g,'&lt;')).join(' · ') + ' <button onclick="copyWinners()">Copy</button>';
  window._winners = names;
}
function copyWinners(){
  navigator.clipboard.writeText('दिवाली धमाका विजेता:\n' + window._winners.join('\n')).then(() => alert('Copy हो गया'));
}
